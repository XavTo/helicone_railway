server {
  listen 8080;

  # Résolveur interne Railway (IPv6)
  resolver fd12::10 ipv6=on valid=10s;
  resolver_timeout 5s;

  set $helicone_host "helicone-all-in-one.railway.internal";

  location /v1/gateway/ {
    proxy_pass http://$helicone_host:8585;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://$helicone_host:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
